<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — Ask Darya</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --cream: #FFF8E7;
            --rust: #C65D3B;
            --deep-teal: #2D4654;
            --sage: #7A9B76;
            --warm-gray: #8B7E74;
            --accent: #E8B298;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, #FFF5DC 100%);
            color: var(--deep-teal);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(122, 155, 118, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(198, 93, 59, 0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(45, 70, 84, 0.1);
            border: 2px solid rgba(122, 155, 118, 0.15);
        }

        .site-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--rust);
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            text-decoration: none;
            display: block;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--deep-teal);
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--deep-teal);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(122, 155, 118, 0.3);
            border-radius: 12px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            color: var(--deep-teal);
            background: var(--cream);
            transition: border-color 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--rust);
            box-shadow: 0 0 0 4px rgba(198, 93, 59, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--rust), #A84D2F);
            color: white;
            border: none;
            border-radius: 50px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(198, 93, 59, 0.3);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(198, 93, 59, 0.1);
            border-left: 4px solid var(--rust);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--rust);
            font-size: 0.9rem;
        }

        .success-message {
            background: rgba(122, 155, 118, 0.1);
            border-left: 4px solid var(--sage);
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: var(--sage);
            font-size: 0.9rem;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--rust);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <a href="https://unsolicited-advice.store" class="site-name">Ask Darya</a>
            <h1>Reset Password</h1>

            <div id="message-container"></div>

            <form id="reset-form">
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" name="new-password" required placeholder="Enter new password" minlength="6">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" required placeholder="Confirm new password" minlength="6">
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Reset Password</button>
            </form>

            <a href="/login.html" class="back-link">Back to Login</a>
        </div>
    </div>

    <script>
        // =====================================================
        // SUPABASE CONFIGURATION
        // =====================================================
        // Replace these with your actual Supabase credentials
        const SUPABASE_URL = 'https://qydxhsevuydcscfqdjsd.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_avuk3uYKIEH0C1ikXpoUJA_VT4v5ymu';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =====================================================
        // UI ELEMENTS
        // =====================================================
        const resetForm = document.getElementById('reset-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageContainer = document.getElementById('message-container');

        // =====================================================
        // HANDLE PASSWORD RESET
        // =====================================================
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            clearMessages();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // Validate passwords match
            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const { error } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                showSuccess('Password updated successfully! Redirecting to login...');
                
                // Redirect to login after 2 seconds
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 2000);
            } catch (error) {
                showError(error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });

        // =====================================================
        // MESSAGES
        // =====================================================
        function showError(message) {
            messageContainer.innerHTML = `<div class="error-message">${message}</div>`;
        }

        function showSuccess(message) {
            messageContainer.innerHTML = `<div class="success-message">${message}</div>`;
        }

        function clearMessages() {
            messageContainer.innerHTML = '';
        }

        // =====================================================
        // CHECK FOR RESET TOKEN
        // =====================================================
        async function checkResetToken() {
            const hashParams = new URLSearchParams(window.location.hash.substring(1));
            const accessToken = hashParams.get('access_token');
            
            if (!accessToken) {
                showError('Invalid or expired reset link. Please request a new one.');
                submitBtn.disabled = true;
            }
        }

        checkResetToken();
    </script>
</body>
</html>
